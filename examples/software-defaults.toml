# Software-validation defaults, not device or acoustic calibration.
sample_rate = 16000
frame_samples = 256
peak_threshold = 0.8
recovery_threshold = 0.6
saturation_threshold = 0.985
saturation_samples = 2
hold_ms = 64.0
normal_confirm_ms = 64.0
recovery_ms = 128.0
model_deadline_ms = 16.0
model_confirm_frames = 2
model_crossfade_ms = 64.0
ceiling_dbfs = -6.0
limiter_release_ms = 100.0
jitter_target_frames = 4
jitter_max_frames = 8
jitter_conceal_frames = 0
telemetry_capacity = 4096
# Protection: "duck" (default) attenuates them by duck_gain_db with gain_fade_ms fades, and treats a
# peak as anomalous only when the frame RMS is relative_trigger_db (or its peak
# peak_over_level_db) above the recent level. Tuned on synthetic data only.
# "mute" zeroes anomalous source frames exactly (previous default).
protection_mode = "duck"
duck_gain_db = -30.0
relative_trigger_db = 15.0
peak_over_level_db = 22.0
gain_fade_ms = 2.0
# Share of the aligned input mixed into the model output (0 = model only).
dry_mix = 0.0
